<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Puzzle — Four of a Kind</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'NY Times Karnak', Georgia, serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 52px 20px 32px;
        }
        h1 { font-size: 2rem; margin-bottom: 4px; font-weight: 700; }
        .subtitle { color: #6f6f6f; margin-bottom: 32px; font-size: 0.95rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        #creator { width: 100%; max-width: 540px; }
        .group-input {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            background: #f0f0f0;
        }
        .group-input label {
            display: block;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .group-input input {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-size: 1rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .group-input input:focus { outline: 2px solid #000; }
        .group-input input::placeholder { color: #999; }
        .cat-input { margin-bottom: 10px; }
        .word-boxes {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .word-boxes input { text-align: center; font-weight: 500; }

        #creator-error {
            background: #fdecea;
            color: #611a15;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            line-height: 1.6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: opacity 0.2s ease, transform 0.15s ease;
        }
        .btn:hover { opacity: 0.8; transform: scale(0.98); }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #000; color: #fff; }
        .btn-secondary { background: #fff; color: #000; border: 1px solid #ddd; }
        .btn-submit { background: #000; color: #fff; margin-top: 8px; width: 100%; padding: 16px; }

        /* Share modal */
        .modal-overlay {
            display: flex;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            max-width: 480px;
            width: 90%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.active .modal { transform: scale(1) translateY(0); }
        .modal h2 { margin-bottom: 16px; font-family: Georgia, serif; }
        .modal .link-box {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 14px;
            word-break: break-all;
            font-size: 0.8rem;
            margin-bottom: 16px;
            max-height: 100px;
            overflow-y: auto;
            color: #333;
        }
        .modal .btn { margin-right: 8px; }

        .nav-links {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 14px 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            z-index: 50;
            background: #fff;
        }
        .nav-links a {
            color: #000;
            text-decoration: none;
            margin-right: 16px;
            font-weight: 500;
        }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/">Browse</a>
    </div>
    <h1>Four of a Kind</h1>
    <p class="subtitle">Create and share your own puzzle</p>

    <div id="creator">
        <div id="group-inputs"></div>
        <div id="name-picker" style="display:none; margin-bottom: 20px; padding: 20px; border-radius: 12px; background: #f0f0f0;">
            <label style="display:block; font-weight:700; margin-bottom:12px; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">Puzzle Name (pick a word)</label>
            <div id="name-options" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
        </div>
        <button class="btn btn-submit" onclick="generateLink()">Create Puzzle</button>
    </div>

    <!-- SHARE MODAL -->
    <div class="modal-overlay" id="share-modal">
        <div class="modal">
            <h2>Share this puzzle</h2>
            <div class="link-box" id="share-link"></div>
            <button class="btn btn-primary" onclick="copyLink(this)">Copy Link</button>
            <button class="btn btn-secondary" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/nanoid.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const COLORS = ['yellow', 'green', 'blue', 'purple'];

        function serialize(groups) {
            return groups.map(g => [g.category, ...g.words].join('~')).join('|').toLowerCase();
        }

        async function compress(str) {
            const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));
            const buf = await new Response(stream).arrayBuffer();
            return btoa(String.fromCharCode(...new Uint8Array(buf)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        let selectedName = null;

        function renderGroupInputs() {
            const container = document.getElementById('group-inputs');
            container.innerHTML = COLORS.map((color, i) => `
                <div class="group-input">
                    <label>Group ${i + 1} (${color})</label>
                    <input class="cat-input" type="text" placeholder="Category name" id="cat-${i}">
                    <div class="word-boxes">
                        <input type="text" placeholder="Word 1" id="word-${i}-0" oninput="updateNamePicker()">
                        <input type="text" placeholder="Word 2" id="word-${i}-1" oninput="updateNamePicker()">
                        <input type="text" placeholder="Word 3" id="word-${i}-2" oninput="updateNamePicker()">
                        <input type="text" placeholder="Word 4" id="word-${i}-3" oninput="updateNamePicker()">
                    </div>
                </div>
            `).join('');
        }

        function updateNamePicker() {
            const words = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const w = document.getElementById(`word-${i}-${j}`).value.trim();
                    if (w) words.push(w);
                }
            }
            const picker = document.getElementById('name-picker');
            const options = document.getElementById('name-options');
            if (words.length === 0) {
                picker.style.display = 'none';
                return;
            }
            picker.style.display = 'block';
            if (selectedName && !words.some(w => w.toLowerCase() === selectedName.toLowerCase())) {
                selectedName = null;
            }
            options.innerHTML = words.map(w => {
                const isSelected = selectedName && w.toLowerCase() === selectedName.toLowerCase();
                return `<button type="button" class="btn ${isSelected ? 'btn-primary' : 'btn-secondary'}" style="padding:8px 14px; font-size:0.85rem;" onclick="pickName('${w.replace(/'/g, "\\'")}')">${w}</button>`;
            }).join('');
        }

        function pickName(word) {
            if (selectedName && selectedName.toLowerCase() === word.toLowerCase()) {
                selectedName = null;
            } else {
                selectedName = word;
            }
            updateNamePicker();
        }

        async function generateLink() {
            const groups = [];
            const errors = [];
            for (let i = 0; i < 4; i++) {
                const category = document.getElementById(`cat-${i}`).value.trim();
                const words = [];
                const missing = [];
                for (let j = 0; j < 4; j++) {
                    const w = document.getElementById(`word-${i}-${j}`).value.trim();
                    if (w) words.push(w);
                    else missing.push(j + 1);
                }
                if (!category) errors.push(`<strong>${COLORS[i]} group</strong>: missing category name`);
                if (missing.length > 0) errors.push(`<strong>${COLORS[i]} group</strong>: missing word${missing.length > 1 ? 's' : ''} ${missing.join(', ')}`);
                groups.push({ category, words, color: COLORS[i] });
            }
            const allWords = groups.flatMap(g => g.words);
            const seen = new Set();
            const dupes = new Set();
            allWords.forEach(w => {
                const lower = w.toLowerCase();
                if (seen.has(lower)) dupes.add(w);
                seen.add(lower);
            });
            if (dupes.size > 0) errors.push(`<strong>Duplicate words</strong>: ${[...dupes].join(', ')}`);

            if (errors.length > 0) {
                showCreatorError(errors.join('<br>'));
                return;
            }
            const serialized = serialize(groups);

            let url;
            if (currentUser) {
                const id = nanoid();
                const insertData = {
                    id,
                    data: serialized,
                    creator_id: currentUser.id
                };
                if (selectedName) insertData.name = selectedName;
                const { error } = await supabaseClient.from('puzzles').insert(insertData);
                if (error) {
                    showCreatorError('Failed to save puzzle. Please try again.');
                    return;
                }
                url = location.origin + '/p/' + id;
            } else {
                const encoded = await compress(serialized);
                url = location.origin + '/play.html#' + encoded;
            }

            document.getElementById('share-link').textContent = url;
            document.getElementById('share-modal').classList.add('active');
            hideCreatorError();
        }

        function showCreatorError(html) {
            let el = document.getElementById('creator-error');
            if (!el) {
                el = document.createElement('div');
                el.id = 'creator-error';
                document.getElementById('creator').insertBefore(el, document.querySelector('.btn-submit'));
            }
            el.style.display = 'block';
            el.innerHTML = html;
        }

        function hideCreatorError() {
            const el = document.getElementById('creator-error');
            if (el) el.style.display = 'none';
        }

        function copyLink(btn) {
            const link = document.getElementById('share-link').textContent;
            navigator.clipboard.writeText(link).then(() => {
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = 'Copy Link', 2000);
            });
        }

        function closeModal() {
            document.getElementById('share-modal').classList.remove('active');
        }

        window.addEventListener('load', async () => {
            await initAuth();
            renderGroupInputs();
        });
    </script>
</body>
</html>
